name: align

# Finds the second at which every ayah begins inside the recorded tafsir «المختصر الصوتي»,
# and saves the result in assets/gharib/mukhtasar_times.json.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 0
            surahs: '2 28 29 49 58 68 75 76 100 103 105'
          - part: 1
            surahs: '15 26 44 45 52 55 65 81 90 98 113'
          - part: 2
            surahs: '7 10 22 30 47 48 60 69 92 101 108 111'
          - part: 3
            surahs: '1 3 18 36 51 57 61 73 77 78 104 110'
          - part: 4
            surahs: '14 17 37 40 53 64 70 85 89 94 99'
          - part: 5
            surahs: '4 12 24 32 38 41 63 80 84 91 114'
          - part: 6
            surahs: '6 13 21 33 42 43 59 67 86 95 102'
          - part: 7
            surahs: '20 23 25 27 34 46 72 79 93 96 97 106'
          - part: 8
            surahs: '5 8 9 19 31 50 62 71 74 87 107'
          - part: 9
            surahs: '11 16 35 39 54 56 66 82 83 88 109 112'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper numpy
      - name: Find where every ayah begins
        run: python3 tool/align_tafsir.py out ${{ matrix.surahs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.part }}
          path: out

  save:
    needs: align
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: timings-*
          merge-multiple: true
      - name: Join the parts
        run: python3 tool/align_tafsir.py --join parts
      - name: Save in the repository
        run: |
          git config user.name "www774475437-svg"
          git config user.email "338496743+www774475437-svg@users.noreply.github.com"
          git add assets/gharib/mukhtasar_times.json
          git commit -m "توقيت آيات المختصر الصوتي" || exit 0
          git pull --rebase -q
          git push
