name: Measure tasmee

# Runs the offline listener on real recitations of whole pages and counts the words the app
# would wrongly mark, and how far behind the reciter it runs.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/eval.yml
      - tool/sim_asr.py

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Quran data
        uses: actions/cache@v4
        with:
          path: |
            assets/data
            assets/fonts
            assets/qcf
          key: quran-data-${{ hashFiles('tool/build_data.py') }}
      - run: test -f assets/data/layout2.json.gz || python3 tool/build_data.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dart-lang/setup-dart@v1
      - name: Recitations (kept between runs)
        uses: actions/cache@v4
        with:
          path: aud
          key: recitations-v1-${{ github.run_id }}
          restore-keys: recitations-v1-
      - name: Tools and models
        run: |
          pip install -q sherpa-onnx librosa numpy soundfile
          gh release download asr-quran-base -R www774475437-svg/smart-mushaf-store -D base -p '*.onnx' -p tokens.txt
          gh release download asr-quran-tiny -R www774475437-svg/smart-mushaf-store -D tiny -p '*.onnx' -p tokens.txt
          gh release download asr-quran-ctc -R www774475437-svg/smart-mushaf-store -D ctc -p '*.onnx' -p tokens.txt
          mkdir vad && cp base/silero_vad.onnx vad/
      - name: Listen (fast model, many reciters)
        env:
          PAGES: '2,50,293,446,582,604'
          RECITERS: 'Husary_64kbps,Alafasy_64kbps,Minshawy_Murattal_128kbps,Abu_Bakr_Ash-Shaatree_128kbps,Hudhaify_128kbps,Abdurrahmaan_As-Sudais_192kbps,Ghamadi_40kbps,MaherAlMuaiqly128kbps,Hani_Rifai_192kbps,Mohammad_al_Tablaway_128kbps,Ayman_Sowaid_64kbps,Nasser_Alqatami_128kbps,Yasser_Ad-Dussary_128kbps,Abdullah_Basfar_192kbps,Abdul_Basit_Murattal_64kbps,Husary_Muallim_128kbps'
        run: python tool/sim_asr.py ctc ctc.json
      - name: Count (fast model)
        run: |
          mkdir -p ev/tool ev/lib/services
          cp tool/eval_matcher.dart ev/tool/ && cp lib/services/recite_matcher.dart ev/lib/services/
          cd ev && dart tool/eval_matcher.dart ../ctc.json 1
      - name: Keep what was heard (branch eval-data), so the matcher can be measured again in a minute
        run: |
          mkdir keep && cp ctc.json keep/ && cd keep
          git init -q -b eval-data
          git -c user.name=www774475437-svg -c user.email=338496743+www774475437-svg@users.noreply.github.com add ctc.json
          git -c user.name=www774475437-svg -c user.email=338496743+www774475437-svg@users.noreply.github.com commit -qm "what the fast model heard"
          git push -q -f https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} eval-data
