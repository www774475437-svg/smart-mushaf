name: TestFlight testers

on:
  workflow_dispatch:
    inputs:
      public:
        description: make a public link (1)
        default: '1'
      phone:
        description: contact phone for Apple review
        required: false
  push:
    paths:
      - .github/workflows/testflight.yml
      - tool/testflight.py

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      PUBLIC: ${{ inputs.public || '1' }}
      PHONE: ${{ inputs.phone }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyjwt cryptography && python3 tool/testflight.py
