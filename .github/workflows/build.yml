name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Quran data and fonts
        uses: actions/cache@v4
        with:
          path: |
            assets/data
            assets/fonts
            assets/qcf
          key: quran-data-${{ hashFiles('tool/build_data.py') }}

      - name: Download Quran data and fonts
        run: python3 tool/build_data.py

      - name: Signing key (kept in the private build cache)
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.mushaf-key
          key: mushaf-signing-key-v1

      - name: Create signing key if missing
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mushaf-key
          PASS=$(openssl rand -hex 16)
          echo -n "$PASS" > ~/.mushaf-key/pass
          keytool -genkeypair -keystore ~/.mushaf-key/release.jks -storepass "$PASS" -keypass "$PASS" \
            -alias mushaf -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Abu Abdulrahman Al-Athari, O=Smart Mushaf, C=US"

      - name: Create Android project
        run: flutter create --org com.abualathari --project-name smart_mushaf --platforms android .

      - name: Patch Android project
        run: |
          export KEY_PATH=$HOME/.mushaf-key/release.jks
          export KEY_PASS=$(cat ~/.mushaf-key/pass)
          python3 tool/patch_android.py | grep "proguard wired"
          echo "patched"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk smart-mushaf-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smart-mushaf-apk
          path: smart-mushaf-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: المصحف الذكي 1.0.${{ github.run_number }}
          files: smart-mushaf-*.apk
          make_latest: true

  web:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Quran data and fonts
        uses: actions/cache@v4
        with:
          path: |
            assets/data
            assets/fonts
            assets/qcf
          key: quran-data-${{ hashFiles('tool/build_data.py') }}

      - name: Download Quran data and fonts
        run: python3 tool/build_data.py

      - name: Create web project
        run: |
          flutter create --org com.abualathari --project-name smart_mushaf --platforms web .
          pip install pillow --break-system-packages -q || pip install pillow -q
          python3 tool/patch_web.py

      - run: flutter pub get

      - name: Build website
        run: flutter build web --release --base-href /smart-mushaf/

      - name: Add the Hajuri mushaf (served by the site so every browser can play it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/web/hajuri
          gh release download hajuri-mushaf -R www774475437-svg/smart-mushaf-store -D build/web/hajuri -p '*.mp3'
          ls build/web/hajuri | wc -l
          du -sh build/web

      - name: Publish website (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          user_name: www774475437-svg
          user_email: 338496743+www774475437-svg@users.noreply.github.com
          commit_message: website update
