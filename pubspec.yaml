name: smart_mushaf
description: المصحف الذكي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  scrollable_positioned_list: ^0.3.8
  archive: ^3.6.1
  geolocator: ^13.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/qcf/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/Scheherazade-Regular.ttf
    - family: NotoNaskh
      fonts:
        - asset: assets/fonts/NotoNaskh-Regular.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: SurahNames
      fonts:
        - asset: assets/fonts/SurahNames.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
